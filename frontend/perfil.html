<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - SoundAtlas</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="/SoundAtlas/frontend/css/style.css">
    <link rel="stylesheet" href="/SoundAtlas/frontend/css/perfil.css"> </head>
<body>

    <header class="profile-header">
        <div class="nav-logo">
            <img src="img/logo.png" alt="SoundAtlas">
        </div>
        <div class="user-menu logout-btn" onclick="window.location.href='index.html'">
            <i class='bx bx-log-out'></i>
        </div>
    </header>

    <div class="main-content">
        <a href="inicio.html" class="btn-back"><i class='bx bx-arrow-back'></i> Volver al Inicio</a>

        <div class="profile-container">
            
            <div class="profile-card">
                <div class="profile-avatar">
                    <i class='bx bxs-user'></i>
                </div>
                <h2 id="profileName">Cargando...</h2>
                <p id="profileEmail" class="email-text">...</p>
                
                <hr class="divider">
                
                <button class="btn-action" onclick="openConfigModal('pass')">
                    Cambiar Contraseña
                </button>
            </div>

            <div class="stats-section">
                <h3>Tu Actividad Musical</h3>
                
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-icon purple-icon">
                            <i class='bx bxs-music'></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="statSongs">0</h3>
                            <p>Canciones Guardadas</p>
                        </div>
                    </div>

                    <div class="stat-box">
                        <div class="stat-icon blue-icon">
                            <i class='bx bxs-playlist'></i>
                        </div>
                        <div class="stat-info">
                            <h3 id="statLists">0</h3>
                            <p>Listas Creadas</p>
                        </div>
                    </div>
                </div>

                <div class="stat-box danger-zone">
                    <div class="stat-icon red-icon">
                        <i class='bx bxs-trash-alt'></i>
                    </div>
                    <div class="stat-info">
                        <p class="delete-text" onclick="alert('Implementaremos borrar cuenta aquí')">Eliminar mi Cuenta</p>
                        <p class="sub-text">Esta acción no se puede deshacer</p>
                    </div>
                </div>
            </div>

        </div>
    </div>


    <div id="configModal" class="modal-overlay" style="display: none;">
        <div class="modal-content profile-modal">
            <h3 id="configTitle">Configuración</h3>
            
            <div id="formNameSection" style="display:none;">
                <p>Elige un nuevo nombre de usuario:</p>
                <input type="text" id="inputNewName" class="modal-input" placeholder="Nuevo nombre">
                <button onclick="submitNameChange()" class="btn-save">Guardar Nombre</button>
            </div>

            <div id="formPassSection" style="display:none;">
                <p>Por seguridad, introduce tu contraseña actual:</p>
                <input type="password" id="inputOldPass" class="modal-input" placeholder="Contraseña Actual">
                <input type="password" id="inputNewPass" class="modal-input" placeholder="Nueva Contraseña">
                <button onclick="submitPassChange()" class="btn-save">Actualizar Contraseña</button>
            </div>

            <button onclick="closeConfigModal()" class="btn-cancel" style="margin-top: 15px;">Cancelar</button>
        </div>
    </div>

    <script src="/SoundAtlas/frontend/js/perfil.js"></script>
</body>
</html>
